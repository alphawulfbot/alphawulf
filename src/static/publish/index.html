<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alpha Wulf V1</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            color: #fff;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .container {
            max-width: 400px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
        }

        .user-info {
            position: absolute;
            top: 0;
            right: 0;
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid #ffd700;
            border-radius: 20px;
            padding: 8px 12px;
            font-size: 12px;
            color: #ffd700;
        }

        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: linear-gradient(45deg, #ffd700, #ffed4e);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
        }

        .logo::before {
            content: "🐺";
            font-size: 40px;
        }

        .title {
            font-size: 28px;
            font-weight: bold;
            color: #ffd700;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 16px;
            color: #ffd700;
            opacity: 0.8;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid #ffd700;
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.2);
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 12px;
            color: #ffd700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .energy-bar {
            width: 100%;
            height: 20px;
            background: rgba(255, 215, 0, 0.2);
            border-radius: 10px;
            margin-bottom: 30px;
            overflow: hidden;
            border: 1px solid #ffd700;
        }

        .energy-fill {
            height: 100%;
            background: linear-gradient(90deg, #ffd700, #ffed4e);
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        .tap-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
        }

        .tap-button {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: linear-gradient(45deg, #8B4513, #D2691E);
            border: 5px solid #ffd700;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.1s ease;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        .tap-button:active {
            transform: scale(0.95);
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.5);
        }

        .tap-button::before {
            content: "🐺";
            font-size: 80px;
            z-index: 2;
        }

        .tap-effect {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.3) 0%, transparent 70%);
            border-radius: 50%;
            opacity: 0;
            animation: tapEffect 0.3s ease-out;
        }

        @keyframes tapEffect {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(1.2); }
        }

        .navigation {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid #ffd700;
            border-radius: 20px;
            padding: 15px;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            padding: 10px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            color: #ffd700;
        }

        .nav-item:hover {
            background: rgba(255, 215, 0, 0.2);
            transform: translateY(-2px);
        }

        .nav-icon {
            font-size: 20px;
        }

        .nav-label {
            font-size: 10px;
            text-align: center;
        }

        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 215, 0, 0.3);
            border-top: 3px solid #ffd700;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            color: #ffd700;
            font-size: 16px;
        }

        .error-message {
            background: rgba(220, 53, 69, 0.1);
            border: 1px solid #dc3545;
            border-radius: 10px;
            padding: 15px;
            margin: 20px 0;
            color: #dc3545;
            text-align: center;
            display: none;
        }

        .debug-panel {
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #ffd700;
            border-radius: 10px;
            padding: 15px;
            margin: 20px 0;
            font-size: 12px;
            color: #ffd700;
            display: none;
            max-height: 200px;
            overflow-y: auto;
        }

        .debug-toggle {
            background: #ffd700;
            color: #1a1a2e;
            border: none;
            border-radius: 5px;
            padding: 5px 10px;
            cursor: pointer;
            font-size: 12px;
            margin: 10px 0;
        }

        .connection-status {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(220, 53, 69, 0.9);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 1001;
            display: none;
        }

        .connection-status.success {
            background: rgba(40, 167, 69, 0.9);
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">
        <div class="loading-spinner"></div>
        <div class="loading-text">Loading...</div>
        <div class="user-info" id="loadingUserInfo">ID: ---</div>
    </div>

    <div class="container" id="gameContainer" style="display: none;">
        <div class="header">
            <div class="user-info" id="userInfo">Loading...</div>
            <div class="logo"></div>
            <div class="title">Alpha Wulf</div>
            <div class="subtitle">Tap to Earn Wolf Coins</div>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-value" id="coinsDisplay">0</div>
                <div class="stat-label">🪙 Coins</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="energyDisplay">100</div>
                <div class="stat-label">⚡ Energy</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="powerDisplay">1</div>
                <div class="stat-label">💪 Power</div>
            </div>
        </div>

        <div class="energy-bar">
            <div class="energy-fill" id="energyFill"></div>
        </div>

        <div class="tap-area">
            <div class="tap-button" id="tapButton">
                <div class="tap-effect" id="tapEffect"></div>
            </div>
        </div>

        <div class="navigation">
            <a href="#" class="nav-item" onclick="showSection('upgrades')">
                <div class="nav-icon">⬆️</div>
                <div class="nav-label">Upgrades</div>
            </a>
            <a href="#" class="nav-item" onclick="showSection('games')">
                <div class="nav-icon">🎮</div>
                <div class="nav-label">Games</div>
            </a>
            <a href="#" class="nav-item" onclick="showSection('withdraw')">
                <div class="nav-icon">💳</div>
                <div class="nav-label">Withdraw</div>
            </a>
            <a href="#" class="nav-item" onclick="showSection('referrals')">
                <div class="nav-icon">👥</div>
                <div class="nav-label">Referrals</div>
            </a>
            <a href="#" class="nav-item" onclick="showSection('stats')">
                <div class="nav-icon">📊</div>
                <div class="nav-label">Stats</div>
            </a>
        </div>

        <div class="error-message" id="errorMessage"></div>
        
        <button class="debug-toggle" onclick="toggleDebug()">Debug Info</button>
        <div class="debug-panel" id="debugPanel"></div>
    </div>

    <div class="connection-status" id="connectionStatus"></div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        // Global variables
        let userData = {
            telegram_id: null,
            username: '',
            first_name: '',
            last_name: '',
            coins: 0,
            energy: 100,
            max_energy: 100,
            tap_power: 1,
            energy_regen_rate: 1,
            total_taps: 0,
            referral_count: 0,
            referral_earnings: 0,
            last_energy_update: 0
        };

        let isAuthenticated = false;
        let debugMode = false;
        let energyRegenInterval = null;

        // Backend configuration
        const BACKEND_URL = 'https://alphawulf-backend-gfgy.onrender.com';

        // Utility functions
        function log(message, type = 'info') {
            console.log(`[${type.toUpperCase()}] ${message}`);
            if (debugMode) {
                updateDebugPanel(`[${type.toUpperCase()}] ${message}`);
            }
        }

        function updateDebugPanel(message) {
            const debugPanel = document.getElementById('debugPanel');
            if (debugPanel) {
                debugPanel.innerHTML += `<div>${new Date().toLocaleTimeString()}: ${message}</div>`;
                debugPanel.scrollTop = debugPanel.scrollHeight;
            }
        }

        function toggleDebug() {
            debugMode = !debugMode;
            const debugPanel = document.getElementById('debugPanel');
            debugPanel.style.display = debugMode ? 'block' : 'none';
            if (debugMode) {
                updateDebugPanel('Debug mode enabled');
            }
        }

        function showError(message) {
            const errorElement = document.getElementById('errorMessage');
            errorElement.textContent = message;
            errorElement.style.display = 'block';
            setTimeout(() => {
                errorElement.style.display = 'none';
            }, 5000);
        }

        function showConnectionStatus(message, isSuccess = false) {
            const statusElement = document.getElementById('connectionStatus');
            statusElement.textContent = message;
            statusElement.className = `connection-status ${isSuccess ? 'success' : ''}`;
            statusElement.style.display = 'block';
            setTimeout(() => {
                statusElement.style.display = 'none';
            }, 3000);
        }

        function hideLoading() {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('gameContainer').style.display = 'block';
        }

        function showLoading() {
            document.getElementById('loading').style.display = 'flex';
            document.getElementById('gameContainer').style.display = 'none';
        }

        // API functions with enhanced error handling and proper Content-Type
        async function makeAPIRequest(endpoint, method = 'GET', data = null) {
            const url = `${BACKEND_URL}${endpoint}`;
            log(`Making ${method} request to ${url}`);

            const options = {
                method: method,
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                mode: 'cors',
                credentials: 'omit'
            };

            if (data && method !== 'GET') {
                options.body = JSON.stringify(data);
                log(`Request data: ${JSON.stringify(data)}`);
            }

            try {
                const response = await fetch(url, options);
                log(`Response status: ${response.status}`);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const responseData = await response.json();
                log(`Response data: ${JSON.stringify(responseData)}`);
                return responseData;
            } catch (error) {
                log(`API request failed: ${error.message}`, 'error');
                throw error;
            }
        }

        async function checkBackendHealth() {
            try {
                const response = await makeAPIRequest('/api/health');
                log('Backend health check successful');
                return true;
            } catch (error) {
                log(`Backend health check failed: ${error.message}`, 'error');
                return false;
            }
        }

        async function authenticateUser() {
            try {
                log('Starting authentication process');

                // Get Telegram user data
                const tg = window.Telegram.WebApp;
                tg.ready();

                if (!tg.initDataUnsafe || !tg.initDataUnsafe.user) {
                    throw new Error('Telegram user data not available');
                }

                const user = tg.initDataUnsafe.user;
                log(`Telegram user data: ${JSON.stringify(user)}`);

                const authData = {
                    telegram_id: user.id,
                    username: user.username || '',
                    first_name: user.first_name || '',
                    last_name: user.last_name || ''
                };

                // Update loading user info
                document.getElementById('loadingUserInfo').textContent = `ID: ${user.id}`;

                // Authenticate with backend
                const response = await makeAPIRequest('/api/auth', 'POST', authData);

                if (response.success && response.user) {
                    userData = { ...userData, ...response.user };
                    isAuthenticated = true;
                    log('Authentication successful');
                    showConnectionStatus('Connected successfully!', true);
                    return true;
                } else {
                    throw new Error('Authentication response invalid');
                }
            } catch (error) {
                log(`Authentication failed: ${error.message}`, 'error');
                showError(`Authentication failed: ${error.message}`);
                return false;
            }
        }

        async function tapCoin() {
            if (!isAuthenticated || userData.energy <= 0) {
                log('Cannot tap: not authenticated or no energy', 'warn');
                return;
            }

            try {
                // Optimistic update
                userData.coins += userData.tap_power;
                userData.energy = Math.max(0, userData.energy - 1);
                userData.total_taps += 1;
                
                updateUI();
                showTapEffect();

                // Send to backend
                const response = await makeAPIRequest('/api/tap', 'POST', {
                    telegram_id: userData.telegram_id
                });

                if (response.success && response.user) {
                    userData = { ...userData, ...response.user };
                    updateUI();
                    log('Tap successful');
                } else {
                    throw new Error('Tap response invalid');
                }
            } catch (error) {
                log(`Tap failed: ${error.message}`, 'error');
                // Revert optimistic update
                userData.coins -= userData.tap_power;
                userData.energy = Math.min(userData.max_energy, userData.energy + 1);
                userData.total_taps -= 1;
                updateUI();
            }
        }

        function showTapEffect() {
            const tapEffect = document.getElementById('tapEffect');
            tapEffect.style.animation = 'none';
            tapEffect.offsetHeight; // Trigger reflow
            tapEffect.style.animation = 'tapEffect 0.3s ease-out';
        }

        function updateUI() {
            document.getElementById('coinsDisplay').textContent = userData.coins.toLocaleString();
            document.getElementById('energyDisplay').textContent = userData.energy;
            document.getElementById('powerDisplay').textContent = userData.tap_power;
            
            // Update energy bar
            const energyPercentage = (userData.energy / userData.max_energy) * 100;
            document.getElementById('energyFill').style.width = `${energyPercentage}%`;

            // Update user info
            const userInfoText = userData.username ? 
                `@${userData.username}` : 
                `${userData.first_name} (${userData.telegram_id})`;
            document.getElementById('userInfo').textContent = userInfoText;
        }

        function startEnergyRegeneration() {
            if (energyRegenInterval) {
                clearInterval(energyRegenInterval);
            }

            energyRegenInterval = setInterval(() => {
                if (userData.energy < userData.max_energy) {
                    userData.energy = Math.min(userData.max_energy, userData.energy + userData.energy_regen_rate);
                    updateUI();
                    log(`Energy regenerated: ${userData.energy}/${userData.max_energy}`);
                }
            }, 30000); // 30 seconds
        }

        function showSection(section) {
            log(`Navigating to section: ${section}`);
            // Here you would implement section navigation
            // For now, just log the action
            showConnectionStatus(`Opening ${section} section...`);
        }

        // Event listeners
        document.addEventListener('DOMContentLoaded', async function() {
            log('DOM loaded, initializing game');

            try {
                // Check backend health
                const isHealthy = await checkBackendHealth();
                if (!isHealthy) {
                    throw new Error('Backend is not responding');
                }

                // Authenticate user
                const authSuccess = await authenticateUser();
                if (!authSuccess) {
                    throw new Error('Authentication failed');
                }

                // Initialize UI
                updateUI();
                startEnergyRegeneration();

                // Add tap event listener
                document.getElementById('tapButton').addEventListener('click', tapCoin);

                // Hide loading screen
                hideLoading();

                log('Game initialized successfully');
            } catch (error) {
                log(`Initialization failed: ${error.message}`, 'error');
                showError(`Failed to load game: ${error.message}`);
                hideLoading();
            }
        });

        // Telegram WebApp event handlers
        if (window.Telegram && window.Telegram.WebApp) {
            const tg = window.Telegram.WebApp;
            
            tg.onEvent('mainButtonClicked', function() {
                log('Main button clicked');
            });

            tg.onEvent('backButtonClicked', function() {
                log('Back button clicked');
            });

            // Expand the web app
            tg.expand();
        }

        // Handle page visibility changes
        document.addEventListener('visibilitychange', function() {
            if (!document.hidden && isAuthenticated) {
                log('Page became visible, refreshing data');
                authenticateUser().then(success => {
                    if (success) {
                        updateUI();
                    }
                });
            }
        });
    </script>
</body>
</html>
